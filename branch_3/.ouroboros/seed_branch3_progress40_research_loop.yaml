- Before a retry after failure, read branch_3/artifacts/lca_tree_stress_v5/retry_loop/latest_failure_report.md if present
- Before a retry after failure, read branch_3/artifacts/lca_tree_stress_v5/retry_loop/latest_failure_breakdown.md if present
- Before a retry after failure, read branch_3/artifacts/lca_tree_stress_v5/retry_loop/latest_analysis_session.md and branch_3/.ouroboros/failure_analysis_state.json if present
- Before a retry after failure, read branch_3/artifacts/lca_tree_stress_v5/retry_loop/latest_next_probe_result.md if present
- Before a retry after failure, read branch_3/artifacts/lca_tree_stress_v5/retry_loop/latest_attempt_guard.md if present
- Before a retry after failure, read branch_3/artifacts/lca_tree_stress_v5/retry_loop/latest_git_repo_health.md if present
- Before a retry after failure, read branch_3/.ouroboros/failure_analysis_iteration.md if present
- Before a retry after failure, read branch_3/.ouroboros/failure_analysis_playbook.md if present
- Before solver edits on a retry, inspect `pinned_primary_axis`, `pinned_secondary_axis`, `next_probe_command`, and `why_this_axis` from branch_3/.ouroboros/failure_analysis_state.json
- Treat branch_3 as a progress40-derived research branch; preserve the literature/progress40 algorithmic direction
- Do not replace the active solver with a fundamentally different algorithm family or a heuristic-only branch-local rewrite merely to chase gate passes
- If the current branch_3 file has drifted, recover the intended progress40 research direction from the bundled materials and continue optimization within that line
- "Keep each solver retry axis-focused: attack the pinned primary axis first and only widen to the secondary axis if the current evidence still points there"
- For `./lca_strong_gate.sh` retries, interpret failure first through correctness/proof and structure-preservation evidence before treating it as a broad performance rewrite problem
- For `./lca_boj3s_gate.sh` retries, interpret failure first through progress40 performance/profile evidence, especially the current residual pivot from current_state_summary.md
- Keep all outputs and solver-side auxiliary outputs inside branch_3/artifacts/... and specifically branch_3/artifacts/lca_tree_stress_v5/...
- Prefer the smallest validating command that gives useful signal before escalating
- Explain which failure mode, bottleneck, research hypothesis, and progress40 axis each code change targets
- Branch-local wrapper and helper edits are allowed when needed for reproducibility, artifact hygiene, or correct branch-local execution
- Preserve the validation intent of the existing wrappers; do not weaken gates or bypass the actual branch-local checks
- Reproducibility must not require manual cleanup or manual deletion of artifacts between reruns
- A single failed gate run is not by itself a terminal condition; continue iterating while progress remains possible within the allowed branch-local scope
- On failure, collect and record the concrete failing AC, the latest relevant artifact summaries, and the local workflow log context before the next retry
- On failure, also record a decomposition of where the workflow got stuck, including dominant execution phases, relevant code files, enclosing functions or wrapper sections, and refinement notes versus the previous failure
- If repeated failures are still too coarse to guide the next fix, improve the branch-local failure-analysis logic itself so the next retry captures narrower line ranges, symbols, snippets, and recurring structural bottlenecks
- Treat the analysis-only mini-session as an iterative narrowing loop too; build on its last session summary, pinned state, and playbook changes instead of restarting that analysis from scratch
acceptance_criteria:
- The branch_3 research notes and bundled progress40 materials are read before major solver rewrites or pivots
- ./lca_smoke.sh is stabilized enough to support further iteration
- ./lca_strong_gate.sh passes as a required prerequisite gate
- Formal closure requires running ./lca_strong_gate.sh twice in a row on the same working tree with both runs PASS
- ./lca_boj3s_gate.sh passes as a required final acceptance gate
- Formal closure also requires running ./lca_boj3s_gate.sh twice in a row on the same working tree with both runs PASS
- The repeated PASS must not depend on manual cleanup of branch_3/artifacts/lca_tree_stress_v5/...
- All generated outputs remain inside branch_3/artifacts/...
ontology_schema:
  name: branch_3_progress40_research_gate_closure
  description: Branch-local BOJ 28350 optimization state for branch_3, including
    progress40-derived research lineage, branch-local solver and helper scope, validation
    gates, reproducibility requirements, artifact discipline, and the need to continue
    iterating after failed gate attempts until acceptance or a real block is reached.
  fields:
  - name: branch_root
    type: string
    description: Root directory where all commands must be run
    required: true
  - name: solver_source
    type: string
    description: Primary solver file intended for research-line optimization edits
    required: true
  - name: research_baseline
    type: array
    description: Branch-local documents and bundled progress40 materials that define the intended research direction
    required: true
  - name: build_command
    type: string
    description: Required build command for the branch
    required: true
  - name: formal_acceptance_wrappers
    type: array
    description: Exact branch-local commands whose PASS state contributes to formal
      acceptance; diagnostic helpers are excluded
    required: true
  - name: validation_wrappers
    type: array
    description: Branch-local validation and diagnostic commands available in the
      branch; this list is not itself the required-gate set
    required: true
  - name: required_gate
    type: string
    description: Authoritative final acceptance gate for closure
    required: true
  - name: diagnostic_tool
    type: string
    description: Non-acceptance diagnostic command for locating slow validated cases
    required: true
  - name: reproducible_rerun_count
    type: number
    description: Minimum consecutive reruns required for formal reproducibility
    required: true
  - name: manual_cleanup_allowed
    type: boolean
    description: Whether operator cleanup between reruns is permitted
    required: true
  - name: artifact_root
    type: string
    description: Directory subtree where all outputs must remain
    required: true
  - name: research_direction_guardrail
    type: string
    description: Rule preventing replacement of the progress40-derived research line with a fundamentally different solver family
    required: true
  - name: failure_loop_policy
    type: string
    description: Rule governing continued iteration after failed validation attempts
    required: true
  - name: current_status
    type: object
    description: Observed pass fail and reproducibility state across gates
    required: true
evaluation_principles:
- name: required_gate_reproducibility
  description: Primary success measure is reproducible PASS on both ./lca_strong_gate.sh
    and ./lca_boj3s_gate.sh on the same working tree without manual cleanup
  weight: 0.45
- name: research_direction_preservation
  description: Changes must remain aligned with the progress40-derived research direction
    documented in branch_3 notes and bundled artifacts
  weight: 0.25
- name: constraint_adherence
  description: All work must respect build, validation, artifact, and file-scope constraints exactly
  weight: 0.15
- name: minimal_signal_first
  description: Use the lightest meaningful validation step before escalating to heavier gates
  weight: 0.05
- name: targeted_optimization
  description: Each code change should address a concrete failure mode, bottleneck, or research hypothesis
  weight: 0.1
exit_conditions:
- name: required_acceptance_met
  description: Stop when formal branch acceptance is achieved
  criteria: Two consecutive ./lca_strong_gate.sh PASS runs and two consecutive
    ./lca_boj3s_gate.sh PASS runs on the same working tree without manual cleanup,
    while remaining aligned with the progress40-derived research direction
- name: blocked_no_progress
  description: Stop only when further progress is blocked by unresolved issues outside
    the allowed edit scope or by a proven dead end that cannot be advanced without
    breaking the research-direction guardrail
  criteria: Cannot continue within the allowed branch-local solver and wrapper/helper
    scope while preserving the progress40-derived algorithmic direction
