goal: Optimize the branch-local solver in branch_3 so the branch reproducibly satisfies
  the required lca_tree_stress_v5 standard, with repeated branch-root validation commands
  succeeding on the same working tree.
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
  - path: /Users/free_1/Library/Mobile Documents/iCloud~md~obsidian/Documents/cpp-checker/branch_3
    role: primary
    summary: Branch root where all build validation and artifact operations must occur
  - path: /Users/free_1/Library/Mobile Documents/iCloud~md~obsidian/Documents/cpp-checker/branch_3/boj28350_resume/boj28350_branch_3_solver.cpp
    role: primary
    summary: Primary solver source for acceptance-focused logic and performance changes
  - path: /Users/free_1/Library/Mobile Documents/iCloud~md~obsidian/Documents/cpp-checker/branch_3/artifact_paths.py
    role: reference
    summary: Branch-local artifact path resolver that may be edited to preserve output locality and rerun hygiene
  - path: /Users/free_1/Library/Mobile Documents/iCloud~md~obsidian/Documents/cpp-checker/branch_3/boj28350_resume.py
    role: reference
    summary: Branch-local helper entrypoint that may be edited to preserve build and smoke reproducibility
  - path: /Users/free_1/Library/Mobile Documents/iCloud~md~obsidian/Documents/cpp-checker/branch_3/artifacts/lca_tree_stress_v5
    role: reference
    summary: Required artifact subtree for validation outputs and auxiliary files
  - path: ./lca_smoke.sh
    role: reference
    summary: Lightweight validation step used first for signal and stabilization
  - path: ./lca_strong_gate.sh
    role: reference
    summary: Required prerequisite gate before final acceptance
  - path: ./lca_rebuttal_gate.sh
    role: reference
    summary: Intermediate diagnostic gate for isolating scaling weaknesses
  - path: ./lca_boj3s_gate.sh
    role: reference
    summary: Required final acceptance gate
  - path: ./lca_hunt.sh
    role: reference
    summary: Diagnostic tool for identifying slow validated cases
  existing_patterns:
  - Work from branch root
  - Build via ./build.sh only
  - Escalate validation from lighter to heavier wrappers
  - Keep validation semantics in existing wrappers unchanged unless a wrapper bug
    is proven
  - Achieve reproducibility on the same working tree without manual artifact cleanup
  - Keep all outputs inside branch-local artifacts directories
  - Summarize progress as inspect failure -> patch solver -> rerun narrowest gate
  existing_dependencies:
  - ./build.sh
  - ./lca_smoke.sh
  - ./lca_strong_gate.sh
  - ./lca_rebuttal_gate.sh
  - ./lca_boj3s_gate.sh
constraints:
- Work only in /Users/free_1/Library/Mobile Documents/iCloud~md~obsidian/Documents/cpp-checker/branch_3
- Keep /Users/free_1/Library/Mobile Documents/iCloud~md~obsidian/Documents/cpp-checker/branch_3/boj28350_resume/boj28350_branch_3_solver.cpp
  as the primary optimization target
- Build only with ./build.sh
- Formal pass/fail validation uses only the branch-local wrappers ./lca_smoke.sh,
  ./lca_strong_gate.sh, and ./lca_boj3s_gate.sh
- ./lca_rebuttal_gate.sh may be run only as a diagnostic helper and must not be
  treated as a required gate or acceptance dependency
- ./lca_hunt.sh may be run only as a diagnostic helper and must not be treated as
  a required gate or acceptance dependency
- Do not switch to the outer lca_tree_stress_v5 solver source
- Keep all outputs and solver-side auxiliary outputs inside branch_3/artifacts/...
  and specifically branch_3/artifacts/lca_tree_stress_v5/...
- Prefer the smallest validating command that gives useful signal before escalating
- Explain which failure mode or bottleneck each code change targets
- Branch-local wrapper and helper edits are allowed when needed for reproducibility,
  artifact hygiene, or correct branch-local execution
- Preserve the validation intent of the existing wrappers; do not weaken gates or
  bypass the actual branch-local checks
- Reproducibility must not require manual cleanup or manual deletion of artifacts
  between reruns
acceptance_criteria:
- ./lca_smoke.sh is stabilized enough to support further iteration
- ./lca_strong_gate.sh passes as a required prerequisite gate
- Formal closure requires running ./lca_strong_gate.sh twice in a row on the same
  working tree with both runs PASS
- ./lca_boj3s_gate.sh passes as a required final acceptance gate
- Formal closure also requires running ./lca_boj3s_gate.sh twice in a row on the
  same working tree with both runs PASS
- The repeated PASS must not depend on manual cleanup of branch_3/artifacts/lca_tree_stress_v5/...
- All generated outputs remain inside branch_3/artifacts/...
ontology_schema:
  name: lca_tree_stress_v5_branch_optimization
  description: Branch-local optimization and validation state for the branch_3 LCA
    solver, including editable source, validation gates, reproducibility requirements,
    artifact discipline, and progress toward required prerequisite and final gates.
  fields:
  - name: branch_root
    type: string
    description: Root directory where all commands must be run
    required: true
  - name: solver_source
    type: string
    description: Primary solver file intended for acceptance-focused edits, even when wrapper/helper edits are also allowed
    required: true
  - name: build_command
    type: string
    description: Required build command for the branch
    required: true
  - name: formal_acceptance_wrappers
    type: array
    description: Exact branch-local commands whose PASS state contributes to formal
      acceptance; diagnostic helpers are excluded
    required: true
  - name: validation_wrappers
    type: array
    description: Branch-local validation and diagnostic commands available in the
      branch; this list is not itself the required-gate set
    required: true
  - name: required_gate
    type: string
    description: Authoritative final acceptance gate for closure
    required: true
  - name: stretch_gate
    type: string
    description: Legacy optional-gate field retained for schema compatibility; not
      used as an acceptance target in this seed
    required: true
  - name: diagnostic_tool
    type: string
    description: Non-acceptance diagnostic command for locating slow validated cases
    required: true
  - name: reproducible_rerun_count
    type: number
    description: Minimum consecutive reruns required for formal reproducibility
    required: true
  - name: manual_cleanup_allowed
    type: boolean
    description: Whether operator cleanup between reruns is permitted
    required: true
  - name: artifact_root
    type: string
    description: Directory subtree where all outputs must remain
    required: true
  - name: target_ladder
    type: array
    description: Ordered escalation path from smoke through stronger gates and diagnostics
    required: true
  - name: wrapper_edit_policy
    type: string
    description: Rule governing how validation wrappers and helper scripts may be changed without weakening validation semantics
    required: true
  - name: change_rationale
    type: string
    description: Failure mode or bottleneck being targeted by a solver change
    required: true
  - name: current_status
    type: object
    description: Observed pass fail and reproducibility state across gates
    required: true
evaluation_principles:
- name: required_gate_reproducibility
  description: Primary success measure is reproducible PASS on both ./lca_strong_gate.sh
    and ./lca_boj3s_gate.sh on the same working tree without manual cleanup
  weight: 0.5
- name: constraint_adherence
  description: All work must respect build, validation, artifact, and file-scope constraints
    exactly
  weight: 0.25
- name: minimal_signal_first
  description: Use the lightest meaningful validation step before escalating to heavier
    gates
  weight: 0.1
- name: targeted_optimization
  description: Each code change should address a concrete failure mode or performance
    bottleneck
  weight: 0.15
- name: final_gate_reproducibility
  description: Final branch acceptance additionally requires two consecutive PASS
    runs of ./lca_boj3s_gate.sh on the same working tree without manual cleanup
  weight: 0.1
exit_conditions:
- name: required_acceptance_met
  description: Stop when formal branch acceptance is achieved
  criteria: Two consecutive ./lca_strong_gate.sh PASS runs and two consecutive
    ./lca_boj3s_gate.sh PASS runs on the same working tree without manual cleanup
- name: blocked_no_progress
  description: Stop when further progress is blocked by unresolved issues outside
    the allowed edit scope or by proven wrapper defects needing owner input
  criteria: Cannot continue within the allowed branch-local solver and wrapper/helper scope
