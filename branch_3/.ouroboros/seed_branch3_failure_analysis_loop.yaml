  - Update failure-analysis helper state every analysis run
  - Tighten localization from file-level to symbol, line-range, wrapper-section, and snippet evidence when possible
  - Rerun capture_failure_context.py after analysis-tool changes so the refreshed latest_failure_breakdown reflects the improved tooling
constraints:
- Work only in /Users/free_1/Library/Mobile Documents/iCloud~md~obsidian/Documents/cpp-checker/branch_3
- This is analysis-only: do not edit boj28350_resume/boj28350_branch_3_solver.cpp or validation wrapper scripts
- Primary editable files are .ouroboros/capture_failure_context.py and .ouroboros/failure_analysis_state.json
- Additional helper analysis files may be added only under branch_3/.ouroboros/
- Read latest_failure_report.md, latest_failure_breakdown.md, failure_history.json, and latest_workflow.log before major edits
- Update .ouroboros/failure_analysis_state.json on every run with a higher revision or otherwise newer narrowed targets
- Write a concise handoff to branch_3/artifacts/lca_tree_stress_v5/retry_loop/latest_analysis_session.md
- If the current analysis is still too coarse, refine the capture logic itself so the next regenerated breakdown narrows the failure further
- After analysis-tool or helper-state changes, rerun capture_failure_context.py against the most recent failed workflow log to refresh latest_failure_report.md and latest_failure_breakdown.md
- Keep all outputs inside branch_3/artifacts/...
acceptance_criteria:
- The latest failed solver attempt is identified and its failure report breakdown history and workflow log are read
- failure_analysis_state.json is updated with narrower pinned ACs paths symbols or notes for the next retry
- latest_analysis_session.md is written with what was learned what tooling changed and what the next solver retry should inspect first
- If the failure-localization logic was too coarse, capture_failure_context.py or a helper analysis file is updated to narrow future captures
- capture_failure_context.py is rerun against the latest failed workflow log after the analysis update so latest_failure_breakdown.md reflects the new analysis state
