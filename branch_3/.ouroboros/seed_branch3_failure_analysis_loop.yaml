goal: After a failed branch_3 solver workflow attempt, run a mandatory analysis-only
  mini-session before any new solver retry. Narrow the failure localization, update
  the branch-local failure-analysis tooling or helper state when needed, regenerate
  the latest failure breakdown with the updated tooling, and record a concise analysis
  handoff for the next solver session.
